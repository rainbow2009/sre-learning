apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-service
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rainbow2009/sre-learning.git
    targetRevision: main
    path: helm/payment-service        # путь к чарту в репо

    helm:
      valueFiles:
        - ../values-uat.yaml          # путь к values относительно чарта

  destination:
    server: https://kubernetes.default.svc    
    namespace: apps

  syncPolicy:
    automated:                       
      prune: true                    
      selfHeal: true                 
    syncOptions:
      - CreateNamespace=true        
