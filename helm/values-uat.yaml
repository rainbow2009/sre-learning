replicaCount: 1

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

config:
  APP_PORT: "8080"
  LOG_LEVEL: "warn"
  KAFKA_BROKER: "kafka.uat.svc:9092"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPU: 50

ingress:
  enabled: true
  host: payment.local
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"